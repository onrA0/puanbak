<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>PuanBak</title>
<style>
:root{--bg:#0f1220;--card:#181c33;--card2:#222850;--tx:#eef0ff;--mut:#9aa0c8;--acc:#ffc107;--g:#2ecc71;--a:#f5a623;--r:#e74c3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
header h1{margin:0;font-size:22px;letter-spacing:.3px}
header h1 span{color:var(--acc)}
button,input{font:inherit}
.icon-btn{background:var(--card);border:0;color:var(--tx);width:40px;height:40px;border-radius:12px;font-size:20px}
main{padding:0 16px 32px;max-width:640px;margin:0 auto}
#searchForm{display:flex;gap:8px;margin-bottom:12px}
#q{flex:1;min-width:0;background:var(--card);border:1px solid #2b3160;color:var(--tx);border-radius:12px;padding:12px 14px}
#q:focus{outline:2px solid var(--acc)}
.btn{background:var(--acc);color:#1a1500;border:0;border-radius:12px;padding:0 18px;font-weight:700}
.btn.sec{background:var(--card2);color:var(--tx);font-weight:600;padding:10px 14px}
#status{color:var(--mut);min-height:22px;margin:6px 2px}
#status.loading::after{content:"";display:inline-block;width:12px;height:12px;margin-left:8px;border:2px solid var(--mut);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:14px}
.head{display:flex;gap:14px}
.poster{width:96px;height:144px;border-radius:12px;object-fit:cover;background:var(--card2);flex:none}
.head h2{margin:0 0 2px;font-size:20px;line-height:1.2}
.meta{color:var(--mut);font-size:14px}
.orig{color:var(--mut);font-size:13px;font-style:italic}
.star{margin-left:auto;background:none;border:0;color:var(--mut);font-size:30px;line-height:1;padding:0;width:48px;height:48px;margin-top:-6px;margin-right:-8px;align-self:flex-start;flex:none;touch-action:manipulation;cursor:pointer}
.star.on{color:var(--acc)}
.verdict{display:flex;align-items:center;gap:12px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--card2)}
.verdict .big{font-size:28px;font-weight:800}
.verdict small{display:block;color:var(--mut)}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.score{background:var(--card2);border-radius:14px;padding:10px 6px;text-align:center;color:var(--tx);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.score b{font-size:13px}
.score small{color:var(--mut);font-size:11px;min-height:14px}
.ring{--p:0;--c:#555;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#2e3562 0)}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:800;font-size:15px}
.overview{margin:12px 0 0;color:#d4d7f2;font-size:14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.overview.open{-webkit-line-clamp:unset}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:var(--card2);color:var(--tx);border:1px solid transparent;border-radius:999px;padding:7px 12px;font-size:13px;text-decoration:none}
.chip.on{border-color:var(--acc);color:var(--acc)}
.note{font-size:13px;color:var(--mut);margin-top:10px}
.note.warn{color:var(--a)}
h3{font-size:15px;margin:16px 2px 8px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:8px;margin:4px 0 10px}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:8px;margin-bottom:8px;width:100%;border:0;color:var(--tx);text-align:left}
.row img,.row .ph{width:42px;height:62px;border-radius:8px;object-fit:cover;background:var(--card2);flex:none}
.row small{color:var(--mut)}
dialog{background:var(--card);color:var(--tx);border:1px solid #2b3160;border-radius:18px;width:min(92vw,460px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog label{display:block;margin:12px 0 4px;font-size:14px;color:var(--mut)}
dialog input{width:100%;background:var(--bg);border:1px solid #2b3160;color:var(--tx);border-radius:10px;padding:10px 12px}
dialog a{color:var(--acc)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.row .rt{margin-left:auto;text-align:right;flex:none;padding-left:6px}
.row .rt b{display:block;font-size:17px}
.row .rt small{display:block;font-size:11px;min-height:14px}
.row .ov{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--mut);font-size:12px}
.chip{cursor:pointer}
.pwrap{position:relative;width:96px;height:144px;flex:none}
.pwrap .poster{width:100%;height:100%;display:block}
.logos{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.logos img,.logos span{width:46px;height:46px;border-radius:11px;box-shadow:0 1px 5px rgba(0,0,0,.6);object-fit:cover;background:#fff}
.logos span{display:grid;place-items:center;background:var(--card2);color:var(--tx);font-size:13px;font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>Puan<span>Bak</span></h1>
  <button class="icon-btn" id="btnSet" aria-label="Ayarlar">⚙</button>
</header>
<main>
  <nav class="tabs" id="modes">
    <button class="chip on" data-mode="look">Puan Bak</button>
    <button class="chip" data-mode="movie">Film Bul</button>
    <button class="chip" data-mode="tv">Dizi Bul</button>
  </nav>
  <div id="viewLook">
  <form id="searchForm">
    <input id="q" placeholder="Film/dizi adı veya paylaşılan metin" autocomplete="off">
    <button class="btn">Ara</button>
  </form>
  <div id="status"></div>
  <div id="result"></div>
  <section id="home" hidden>
    <div class="tabs">
      <button class="chip on" data-tab="hist">Son bakılanlar</button>
      <button class="chip" data-tab="watch">İzlenecekler ★</button>
    </div>
    <div id="list"></div>
  </section>
  </div>

  <div id="viewFind" hidden>
    <div class="card">
      <h3 style="margin-top:0">Platform</h3>
      <div class="chips" id="fPlat"></div>
      <h3>Tür</h3>
      <div class="chips" id="fGenre"></div>
      <h3>Puan</h3>
      <div class="chips" id="fRate"></div>
      <button class="btn" id="btnFind" type="button" style="width:100%;height:46px;margin-top:16px">Bul</button>
    </div>
    <div id="fstatus" class="note"></div>
    <div id="fList"></div>
    <button class="btn sec" id="btnMore" type="button" style="width:100%" hidden>Daha fazla göster</button>
  </div>
</main>

<dialog id="dlg">
  <h2 style="margin:0 0 4px">Ayarlar</h2>
  <div class="note">Anahtarlar sadece bu cihazda saklanır. İkisi de ücretsiz.</div>
  <label for="kTmdb">TMDB API anahtarı (v3) — <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">buradan al</a></label>
  <input id="kTmdb" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label for="kOmdb">OMDb API anahtarı — <a href="https://www.omdbapi.com/apikey.aspx" target="_blank" rel="noopener">buradan al</a></label>
  <input id="kOmdb" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label for="kMdb">MDBList API anahtarı (isteğe bağlı) — <a href="https://mdblist.com/preferences/" target="_blank" rel="noopener">buradan al</a></label>
  <input id="kMdb" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="note">TMDB: arama, Türkçe özet, TMDB puanı, nerede izlenir. OMDb: IMDb, Rotten Tomatoes ve Metacritic puanları. MDBList: dizilerde OMDb'nin vermediği Rotten Tomatoes ve Metacritic puanlarını tamamlar.</div>
  <div class="actions">
    <button class="btn sec" id="btnClear" type="button">Önbelleği temizle</button>
    <button class="btn sec" id="btnCancel" type="button">Kapat</button>
    <button class="btn" id="btnSave" type="button">Kaydet</button>
  </div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const cfg=()=>LS.get('cfg',{tmdb:'',omdb:''});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={results:[],idx:0,link:''};
let tab='hist';

/*PARSE_START*/
function parseShared(title,text,url){
  const all=[title,text,url].filter(Boolean).join(' ');
  const link=(all.match(/https?:\/\/[^\s]+/)||[''])[0];
  let type=null,name='';
  const m=link.match(/\/(film|dizi)-izle\/([^/?#]+)/i);
  if(m) type=m[1].toLowerCase()==='film'?'movie':'tv';
  const q=all.match(/[“"„]([^”"“„]{1,120})[”"“]/);
  if(q) name=q[1].trim();
  if(!name&&m){
    let slug=m[2];
    try{slug=decodeURIComponent(slug)}catch{}
    name=slug.replace(/--?\d+$/,'').replace(/-/g,' ').trim();
  }
  // Prime Video: "Selam, şimdi Sürüş - Yalancılar izliyorum. Prime Video'ya girip baksana!"
  if(/primevideo\.com|amazon\./i.test(link)&&/share_mv(&|$)/.test(link)) type='movie';
  if(!name){
    const txt=all.replace(/https?:\/\/\S+/g,' ').replace(/\s+/g,' ');
    const w=txt.match(/(?:şimdi|şu an|su an)\s+(.+?)\s+izliyorum/i)||txt.match(/^(?:selam,?\s*)?(.+?)\s+izliyorum/i);
    if(w) name=w[1].trim();
  }
  if(!name) name=all.replace(/https?:\/\/\S+/g,'').split('\n')[0].trim();
  return {name,type,link};
}
function platformOf(link){
  if(/tvplus\./i.test(link)) return 'TV+';
  if(/primevideo\.|amazon\./i.test(link)) return 'Prime Video';
  if(/netflix\./i.test(link)) return 'Netflix';
  return '';
}
/*PARSE_END*/

async function tmdb(path,params={}){
  const u=new URL('https://api.themoviedb.org/3'+path);
  u.searchParams.set('api_key',cfg().tmdb);
  u.searchParams.set('language','tr-TR');
  for(const k in params) u.searchParams.set(k,params[k]);
  const r=await fetch(u);
  if(r.status===401) throw new Error('TMDB anahtarı geçersiz');
  if(!r.ok) throw new Error('TMDB hatası '+r.status);
  return r.json();
}
async function omdb(imdbId){
  const r=await fetch(`https://www.omdbapi.com/?i=${encodeURIComponent(imdbId)}&apikey=${encodeURIComponent(cfg().omdb)}&tomatoes=true`);
  const j=await r.json();
  if(j.Response==='False') throw new Error(j.Error||'OMDb hatası');
  return j;
}
async function mdblist(type,tmdbId){
  const r=await fetch(`https://api.mdblist.com/tmdb/${type==='tv'?'show':'movie'}/${tmdbId}?apikey=${encodeURIComponent(cfg().mdb)}`);
  if(r.status===401||r.status===403) throw new Error('anahtar geçersiz');
  if(!r.ok) throw new Error('hata '+r.status);
  const j=await r.json();
  const out={};
  for(const x of (j.ratings||[])){
    const s=String(x.source||'').toLowerCase();
    const v=Number(x.score!=null?x.score:x.value);
    if(!isFinite(v)||(x.score==null&&x.value==null)) continue;
    if(/tomato/.test(s)&&!/audience|popcorn|user/.test(s)&&out.rt==null) out.rt=Math.round(v);
    else if(s==='metacritic'&&out.mc==null) out.mc=Math.round(v);
  }
  return out;
}
async function search(name,type){
  const ep=type?`/search/${type}`:'/search/multi';
  // Önce tam ad, bulunamazsa " - " veya ":" öncesi kısa ad (örn. "Sürüş - Yalancılar" → "Sürüş")
  const tries=[name];
  const short=name.split(/\s[-–—]\s|:\s/)[0].trim();
  if(short&&short!==name) tries.push(short);
  for(const n of tries){
    const j=await tmdb(ep,{query:n,include_adult:'false'});
    const r=(j.results||[])
      .filter(x=>type||x.media_type==='movie'||x.media_type==='tv')
      .map(x=>({...x,media_type:type||x.media_type}))
      .slice(0,8);
    if(r.length) return r;
  }
  return [];
}
async function getInfo(item){
  const key=`c:${item.media_type}:${item.id}`;
  const cache=LS.get(key,null);
  if(cache&&Date.now()-cache.t<3*86400000&&(cache.o||!cfg().omdb)&&(!cfg().mdb||cache.mt)) return cache;
  const d=await tmdb(`/${item.media_type}/${item.id}`,{append_to_response:'external_ids,watch/providers,videos',include_video_language:'tr,en,null'});
  const imdbId=d.external_ids?.imdb_id||d.imdb_id||'';
  let o=null,oerr='';
  if(imdbId&&cfg().omdb){ try{o=await omdb(imdbId)}catch(e){oerr=e.message} }
  // OMDb eksik bıraktığı Rotten Tomatoes / Metacritic puanlarını MDBList'ten tamamla
  let m=null,mt=false,merr='';
  if(cfg().mdb){
    const s=scoresOf(d,o,null);
    if(isNaN(s.rt)||isNaN(s.mc)){ try{m=await mdblist(item.media_type,item.id);mt=true}catch(e){merr=e.message} }
    else mt=true;
  }
  const info={t:Date.now(),d,o,oerr,m,mt,merr};
  if(o||m) LS.set(key,info);
  return info;
}

function setStatus(msg,loading){const s=$('#status');s.textContent=msg||'';s.className=loading?'loading':'';}

async function run(name,type,link){
  if(!cfg().tmdb){openSettings();setStatus('Önce TMDB anahtarını gir.');return}
  if(!name){setStatus('Bir ad yaz veya bağlantı yapıştır.');return}
  setStatus('Aranıyor…',true);
  $('#result').innerHTML='';$('#home').hidden=true;
  try{
    const results=await search(name,type);
    if(!results.length){setStatus(`“${name}” bulunamadı. Adı farklı yazmayı dene.`);showHome();return}
    state={results,idx:0,link:link||''};
    await show(0);
  }catch(e){setStatus('Hata: '+e.message)}
}

async function show(i){
  state.idx=i;
  const item=state.results[i];
  setStatus('Puanlar getiriliyor…',true);
  try{
    const info=await getInfo(item);
    render(item,info);
    setStatus('');
    addHist(item,info.d);
    showHome();
  }catch(e){setStatus('Hata: '+e.message)}
}

function fmtVotes(v){return v&&v!=='N/A'?v+' oy':''}
function ring(p,txt,label,sub){
  const ok=!isNaN(p);
  const c=!ok?'#555':p>=75?'var(--g)':p>=55?'var(--a)':'var(--r)';
  return `<div class="score"><div class="ring" style="--p:${ok?p:0};--c:${c}"><span>${ok?esc(txt):'–'}</span></div><b>${esc(label)}</b><small>${esc(sub||'')}</small></div>`;
}

function scoresOf(d,o,m){
  const imdb=o?parseFloat(o.imdbRating):NaN;
  let rt=o?parseInt((o.Ratings||[]).find(r=>r.Source==='Rotten Tomatoes')?.Value):NaN;
  let mc=o?parseInt(o.Metascore):NaN;
  if(isNaN(rt)&&m&&m.rt!=null) rt=m.rt;
  if(isNaN(mc)&&m&&m.mc!=null) mc=m.mc;
  const tm=d.vote_count>=5?d.vote_average:NaN;
  return {imdb,rt,mc,tm};
}
function calcAvg(info){
  const {imdb,rt,mc,tm}=scoresOf(info.d,info.o,info.m);
  const p=[imdb*10,rt,mc,tm*10].filter(x=>!isNaN(x));
  return p.length?Math.round(p.reduce((a,b)=>a+b,0)/p.length):NaN;
}
function logosHtml(provs){
  if(!provs.length) return '';
  const show=provs.length>6?provs.slice(0,5):provs;
  const more=provs.length>6?`<span title="${esc(provs.slice(5).map(p=>p.provider_name).join(', '))}">+${provs.length-5}</span>`:'';
  return `<div class="logos">${show.map(p=>p.logo_path?`<img src="https://image.tmdb.org/t/p/w92${p.logo_path}" alt="${esc(p.provider_name)}" title="${esc(p.provider_name)}">`:`<span title="${esc(p.provider_name)}">${esc(p.provider_name.slice(0,2))}</span>`).join('')}${more}</div>`;
}

function linkCard(label,href){
  return `<a class="score" href="${esc(href)}" target="_blank" rel="noopener"><div class="ring"><span>↗</span></div><b>${esc(label)}</b><small>Puanı gör</small></a>`;
}

function render(item,info){
  const {d,o,oerr,m,merr}=info;
  const t=item.media_type;
  const title=d.title||d.name||'';
  const orig=d.original_title||d.original_name||'';
  const year=(d.release_date||d.first_air_date||'').slice(0,4);
  const imdbId=d.external_ids?.imdb_id||d.imdb_id||'';
  const {imdb,rt,mc,tm}=scoresOf(d,o,m);
  const pcts=[imdb*10,rt,mc,tm*10].filter(x=>!isNaN(x));
  const avg=pcts.length?Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length):NaN;
  const vText=isNaN(avg)?'Puan bulunamadı':avg>=75?'İzlemeye değer':avg>=60?'İdare eder':'Pas geçebilirsin';
  const vCol=isNaN(avg)?'var(--mut)':avg>=75?'var(--g)':avg>=60?'var(--a)':'var(--r)';
  const len=t==='tv'?(d.number_of_seasons?d.number_of_seasons+' sezon':''):(d.runtime?d.runtime+' dk':'');
  const genres=(d.genres||[]).map(g=>g.name).slice(0,3).join(', ');
  const meta=[t==='tv'?'Dizi':'Film',year,len,genres].filter(Boolean).join(' · ');
  const provs=d['watch/providers']?.results?.TR?.flatrate||[];
  const trailer=(d.videos?.results||[]).find(v=>v.site==='YouTube'&&v.type==='Trailer');
  const saved=isSaved(item.id,t);
  const qTitle=encodeURIComponent(title||orig);
  const qOrig=encodeURIComponent(orig||title);

  const alts=state.results.length>1?`<h3>Başka sonuç mu?</h3><div class="chips">${state.results.slice(0,6).map((r,j)=>{
    const y=(r.release_date||r.first_air_date||'').slice(0,4);
    return `<button class="chip ${j===state.idx?'on':''}" data-alt="${j}">${esc(r.title||r.name)}${y?' ('+y+')':''}${r.media_type==='tv'?' 📺':''}</button>`}).join('')}</div>`:'';

  let notes='';
  if(!cfg().omdb) notes+=`<div class="note warn">IMDb / Rotten Tomatoes / Metacritic için ayarlardan OMDb anahtarı ekle.</div>`;
  else if(oerr) notes+=`<div class="note warn">OMDb: ${esc(oerr)}</div>`;
  else if(!imdbId) notes+=`<div class="note warn">Bu başlık için IMDb kaydı bulunamadı.</div>`;
  if(o&&o.Awards&&o.Awards!=='N/A') notes+=`<div class="note">🏆 ${esc(o.Awards)}</div>`;
  if(o&&(isNaN(rt)||isNaN(mc))){
    if(!cfg().mdb) notes+=`<div class="note warn">${t==='tv'?'OMDb dizilerde Rotten Tomatoes ve Metacritic vermiyor.':'Bu başlıkta OMDb’de Rotten Tomatoes / Metacritic puanı yok.'} Ayarlardan ücretsiz MDBList anahtarı eklersen onlardan da çekmeyi dener.</div>`;
    else if(merr) notes+=`<div class="note warn">MDBList: ${esc(merr)}</div>`;
  }
  const plat=platformOf(state.link);
  if(state.link) notes+=`<div class="note">${plat?esc(plat)+' üzerinden paylaşıldı.':'Bağlantı paylaşıldı.'}</div>`;

  $('#result').innerHTML=`
  <div class="card">
    <div class="head">
      <div class="pwrap">${d.poster_path?`<img class="poster" src="https://image.tmdb.org/t/p/w342${d.poster_path}" alt="">`:`<div class="poster"></div>`}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex"><h2>${esc(title)}</h2><button class="star ${saved?'on':''}" id="star" aria-label="İzlenecekler">${saved?'★':'☆'}</button></div>
        ${orig&&orig!==title?`<div class="orig">${esc(orig)}</div>`:''}
        <div class="meta">${esc(meta)}</div>
        ${logosHtml(provs)}
      </div>
    </div>
    <div class="verdict"><div class="big" style="color:${vCol}">${isNaN(avg)?'–':avg}</div><div><b>${vText}</b><small>${pcts.length} kaynağın ortalaması (100 üzerinden)</small></div></div>
    <div class="scores">
      ${ring(imdb*10,isNaN(imdb)?'':imdb.toFixed(1),'IMDb',o?fmtVotes(o.imdbVotes):'')}
      ${isNaN(rt)?linkCard('Rotten Tomatoes','https://www.rottentomatoes.com/search?search='+qOrig):ring(rt,rt+'%','Rotten Tomatoes','Eleştirmen')}
      ${isNaN(mc)?linkCard('Metacritic','https://www.metacritic.com/search/'+qOrig+'/'):ring(mc,String(mc),'Metacritic','100 üzerinden')}
      ${ring(tm*10,isNaN(tm)?'':tm.toFixed(1),'TMDB',d.vote_count?d.vote_count+' oy':'')}
      ${linkCard('sinemalar','https://www.google.com/search?q='+encodeURIComponent('sinemalar.com '+(title||orig)+' '+year))}
      ${linkCard('beyazperde','https://www.google.com/search?q='+encodeURIComponent('beyazperde.com '+(title||orig)+' '+year))}
    </div>
    ${d.overview?`<p class="overview" id="ov">${esc(d.overview)}</p>`:''}
    ${notes}
    <div class="chips">
      ${imdbId?`<a class="chip" href="https://www.imdb.com/title/${imdbId}/" target="_blank" rel="noopener">IMDb sayfası</a>`:''}
      <a class="chip" href="https://www.rottentomatoes.com/search?search=${qOrig}" target="_blank" rel="noopener">Rotten Tomatoes</a>
      ${trailer?`<a class="chip" href="https://www.youtube.com/watch?v=${esc(trailer.key)}" target="_blank" rel="noopener">▶ Fragman</a>`:`<a class="chip" href="https://www.youtube.com/results?search_query=${qTitle}+fragman" target="_blank" rel="noopener">▶ Fragman ara</a>`}
      ${state.link?`<a class="chip" href="${esc(state.link)}" target="_blank" rel="noopener">${plat?esc(plat)+"'da aç":'Bağlantıyı aç'}</a>`:''}
    </div>
  </div>
  ${alts}`;

  $('#star').onclick=()=>{
    toggleSave(item,d);
    const on=isSaved(item.id,t),s=$('#star');
    s.classList.toggle('on',on);s.textContent=on?'★':'☆';
    if(on) tab='watch';
    showHome();
    setStatus(on?'İzlenecekler listesine eklendi ★':'İzlenecekler listesinden çıkarıldı');
    setTimeout(()=>{if(/^İzlenecekler/.test($('#status').textContent))setStatus('')},2200);
  };
  const ov=$('#ov'); if(ov) ov.onclick=()=>ov.classList.toggle('open');
  document.querySelectorAll('[data-alt]').forEach(b=>b.onclick=()=>show(+b.dataset.alt));
  window.scrollTo({top:0,behavior:'smooth'});
}

/* geçmiş & izlenecekler */
const slim=(item,d)=>({id:item.id,media_type:item.media_type,title:d.title||d.name||item.title||item.name,year:(d.release_date||d.first_air_date||'').slice(0,4),poster:d.poster_path||''});
function addHist(item,d){
  const h=LS.get('hist',[]).filter(x=>!(x.id===item.id&&x.media_type===item.media_type));
  h.unshift(slim(item,d));LS.set('hist',h.slice(0,20));
}
function isSaved(id,t){return LS.get('watch',[]).some(x=>x.id===id&&x.media_type===t)}
function toggleSave(item,d){
  let w=LS.get('watch',[]);
  if(isSaved(item.id,item.media_type)) w=w.filter(x=>!(x.id===item.id&&x.media_type===item.media_type));
  else w.unshift(slim(item,d));
  LS.set('watch',w);
}
function showHome(){
  $('#home').hidden=false;
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const list=LS.get(tab,[]);
  $('#list').innerHTML=list.length?list.map((x,i)=>`<button class="row" data-i="${i}">${x.poster?`<img src="https://image.tmdb.org/t/p/w92${x.poster}" alt="">`:'<div class="ph"></div>'}<div><b>${esc(x.title)}</b><br><small>${x.media_type==='tv'?'Dizi':'Film'}${x.year?' · '+x.year:''}</small></div></button>`).join(''):`<div class="note">${tab==='hist'?'Henüz bir şey aramadın.':'Listen boş. Bir filmin yanındaki ☆ simgesine dokun.'}</div>`;
  document.querySelectorAll('#list [data-i]').forEach(b=>b.onclick=()=>{
    const x=list[+b.dataset.i];
    state={results:[{id:x.id,media_type:x.media_type,title:x.title}],idx:0,link:''};
    show(0);
  });
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;showHome()});

/* ayarlar */
const dlg=$('#dlg');
function openSettings(){const c=cfg();$('#kTmdb').value=c.tmdb||'';$('#kOmdb').value=c.omdb||'';$('#kMdb').value=c.mdb||'';dlg.showModal()}
$('#btnSet').onclick=openSettings;
$('#btnCancel').onclick=()=>dlg.close();
$('#btnSave').onclick=()=>{LS.set('cfg',{tmdb:$('#kTmdb').value.trim(),omdb:$('#kOmdb').value.trim(),mdb:$('#kMdb').value.trim()});dlg.close();setStatus('Ayarlar kaydedildi.')};
$('#btnClear').onclick=()=>{Object.keys(localStorage).filter(k=>k.startsWith('c:')).forEach(k=>localStorage.removeItem(k));setStatus('Önbellek temizlendi.');dlg.close()};

/* arama kutusu */
$('#searchForm').onsubmit=e=>{
  e.preventDefault();
  const s=parseShared('',$('#q').value.trim(),'');
  run(s.name,s.type,s.link);
};

/* ---------- Film Bul / Dizi Bul ---------- */
const PLATS=[
  {k:'tv',n:'TV+',re:/^tv ?\+$/i,fb:null},
  {k:'hbo',n:'HBO Max',re:/^(hbo max|max)$/i,fb:1899},
  {k:'prime',n:'Amazon Prime',re:/^amazon prime video$/i,fb:119},
  {k:'nflx',n:'Netflix',re:/^netflix$/i,fb:8},
  {k:'disney',n:'Disney+',re:/^disney( plus|\+)$/i,fb:337}
];
const GENRES={
  movie:[[0,'Tümü'],[28,'Aksiyon'],[35,'Komedi'],[53,'Gerilim'],[18,'Dram'],[27,'Korku'],[878,'Bilim Kurgu'],[10749,'Romantik'],[12,'Macera'],[80,'Suç'],[9648,'Gizem'],[16,'Animasyon'],[10751,'Aile'],[14,'Fantastik']],
  tv:[[0,'Tümü'],[10759,'Aksiyon & Macera'],[35,'Komedi'],[18,'Dram'],[80,'Suç'],[9648,'Gizem'],[10765,'Bilim Kurgu & Fantastik'],[16,'Animasyon'],[10751,'Aile'],[99,'Belgesel'],[10764,'Gerçeklik']]
};
const RATES=[{k:'mid',n:'70–80',min:7,max:8},{k:'hi',n:'80 ve üstü',min:8,max:null}];
let fsel=Object.assign({p:'tv',r:'mid',g_movie:0,g_tv:0},LS.get('fsel',{}));
let fkind='movie',fpage=0,ftotal=0,ftoken=0;
const gKey=()=>'g_'+fkind;

function drawChips(){
  const mk=(id,items,cur,attr)=>{$(id).innerHTML=items.map(([v,n])=>`<button type="button" class="chip ${String(v)===String(cur)?'on':''}" data-${attr}="${v}">${esc(n)}</button>`).join('')};
  mk('#fPlat',PLATS.map(p=>[p.k,p.n]),fsel.p,'fp');
  mk('#fGenre',GENRES[fkind],fsel[gKey()],'fg');
  mk('#fRate',RATES.map(r=>[r.k,r.n]),fsel.r,'fr');
}
function pick(e,attr,key){
  const b=e.target.closest(`[data-${attr}]`); if(!b) return;
  fsel[key]=key.startsWith('g_')?+b.dataset[attr]:b.dataset[attr];
  LS.set('fsel',fsel);drawChips();
}
$('#fPlat').onclick=e=>pick(e,'fp','p');
$('#fGenre').onclick=e=>pick(e,'fg',gKey());
$('#fRate').onclick=e=>pick(e,'fr','r');

async function provId(p,kind){
  const ck=p.k+':'+kind;
  const c=LS.get('prov2',{});
  if(c[ck]) return c[ck];
  const j=await tmdb(`/watch/providers/${kind}`,{watch_region:'TR'});
  const hit=(j.results||[]).find(x=>p.re.test(String(x.provider_name).replace(/\s+/g,' ').trim()));
  const id=hit?hit.provider_id:p.fb;
  if(hit){c[ck]=id;LS.set('prov2',c)}
  return id;
}

function setMode(m){
  const find=m==='movie'||m==='tv';
  $('#viewLook').hidden=find;
  $('#viewFind').hidden=!find;
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  if(find){
    if(fkind!==m){fkind=m;ftoken++;$('#fList').innerHTML='';$('#fstatus').textContent='';$('#btnMore').hidden=true}
    drawChips();
  }
  window.scrollTo(0,0);
}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));

async function findTitles(reset){
  if(!cfg().tmdb){openSettings();$('#fstatus').textContent='Önce TMDB anahtarını gir.';return}
  const my=++ftoken;
  const kind=fkind;
  const p=PLATS.find(x=>x.k===fsel.p)||PLATS[0];
  const r=RATES.find(x=>x.k===fsel.r)||RATES[0];
  const g=fsel['g_'+kind];
  if(reset){fpage=0;$('#fList').innerHTML='';$('#btnMore').hidden=true}
  $('#fstatus').textContent='Aranıyor…';
  try{
    const id=await provId(p,kind);
    if(!id){$('#fstatus').textContent=`${p.n} TMDB'de bulunamadı.`;return}
    const params={watch_region:'TR',with_watch_providers:id,with_watch_monetization_types:'flatrate',sort_by:'vote_average.desc','vote_count.gte':kind==='tv'?100:150,'vote_average.gte':r.min,include_adult:'false',page:fpage+1};
    if(r.max) params['vote_average.lte']=r.max-0.01;
    if(g) params.with_genres=g;
    const j=await tmdb('/discover/'+kind,params);
    if(my!==ftoken) return;
    fpage=j.page||fpage+1;ftotal=j.total_results||0;
    const items=j.results||[];
    const word=kind==='tv'?'dizi':'film';
    if(!items.length&&reset){$('#fstatus').textContent=`Bu seçimlere uyan ${word} bulunamadı. Türü veya platformu değiştirmeyi dene.`;return}
    $('#fstatus').textContent=`${ftotal} ${word} bulundu`;
    $('#fList').insertAdjacentHTML('beforeend',items.map(x=>{
      const y=(x.release_date||x.first_air_date||'').slice(0,4);
      return `<button class="row" data-fid="${x.id}" data-fk="${kind}" data-tm="${Math.round(x.vote_average*10)}">${x.poster_path?`<img src="https://image.tmdb.org/t/p/w92${x.poster_path}" alt="">`:'<div class="ph"></div>'}<div style="min-width:0"><b>${esc(x.title||x.name)}</b>${y?` <small>(${y})</small>`:''}<div class="ov">${esc(x.overview||'')}</div></div><div class="rt"><b>${(x.vote_average*10).toFixed(0)}</b><small id="sc-${kind}-${x.id}">TMDB</small></div></button>`}).join(''));
    $('#btnMore').hidden=fpage*20>=ftotal||fpage>=25;
    if(cfg().omdb) enrich(items,my,kind);
  }catch(e){if(my===ftoken)$('#fstatus').textContent='Hata: '+e.message}
}

async function enrich(items,my,kind){
  const q=items.slice();
  const worker=async()=>{
    while(q.length&&my===ftoken){
      const x=q.shift();
      try{
        const info=await getInfo({id:x.id,media_type:kind});
        const el=document.getElementById(`sc-${kind}-${x.id}`);
        const a=calcAvg(info);
        if(el&&!isNaN(a)){el.textContent='ortalama';el.parentElement.firstElementChild.textContent=a;const row=el.closest('.row');if(row)row.dataset.avg=a}
      }catch{}
    }
  };
  await Promise.all([worker(),worker(),worker()]);
  // Ortalamalar gelince bu sayfadaki filmleri yüksek puandan düşüğe diz
  if(my!==ftoken) return;
  const list=$('#fList');
  const rows=items.map(x=>list.querySelector(`[data-fid="${x.id}"][data-fk="${kind}"]`)).filter(Boolean);
  if(rows.length<2) return;
  const anchor=rows[rows.length-1].nextSibling;
  rows.sort((a,b)=>(+b.dataset.avg||+b.dataset.tm)-(+a.dataset.avg||+a.dataset.tm)).forEach(r=>list.insertBefore(r,anchor));
}

$('#btnFind').onclick=()=>findTitles(true);
$('#btnMore').onclick=()=>findTitles(false);
$('#fList').onclick=e=>{
  const b=e.target.closest('[data-fid]'); if(!b) return;
  state={results:[{id:+b.dataset.fid,media_type:b.dataset.fk}],idx:0,link:''};
  setMode('look');$('#home').hidden=true;$('#result').innerHTML='';show(0);
};

/* başlangıç: paylaşımla açıldıysa otomatik çalıştır */
window.addEventListener('load',()=>{
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  const p=new URLSearchParams(location.search);
  if(p.get('title')||p.get('text')||p.get('url')){
    const s=parseShared(p.get('title'),p.get('text'),p.get('url'));
    history.replaceState(null,'',location.pathname);
    $('#q').value=s.name;
    run(s.name,s.type,s.link);
  }else{
    showHome();
    if(!cfg().tmdb) openSettings();
  }
});
</script>
